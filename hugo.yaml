# Hugo configuration file
title: SAH Electronics Dokumentacija

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Dokumentacija
      pageRef: /dokumentacija
      weight: 1
    - name: O Nama
      pageRef: /onama
      weight: 2
    - name: Kontakt
      pageRef: /kontakt
      weight: 3
    - name: Prodavnica ↗
      url: "https://sah.rs"
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: Theme Toggle
      params:
        type: theme-toggle
        label: true # optional, default is false
    - name: Language Switcher
      params:
        type: language-switch
        label: true # optional, default is false
        icon: "globe-alt" # optional, default is "translate"

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      link: /
      width: 40
      height: 20
  externalLinkDecoration: true
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"

defaultContentLanguage: sr
languages:
  sr:
    label: Srpski
    weight: 1
  en:
    label: English
    weight: 2
